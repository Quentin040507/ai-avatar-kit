<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>做你自己的个人主页</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#fbf7f0;color:#3a3226;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:420px;text-align:center}
.logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:#ffd9a0;
display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 18px rgba(214,160,90,.28)}
h1{margin:0 0 6px;font-size:21px;letter-spacing:.5px}
.sub{margin:0 0 22px;font-size:13px;color:#9a8f7d}
.steps{background:#fff;border:1px solid #ece2d2;border-radius:14px;padding:16px 14px;margin-bottom:18px;text-align:left}
.steps div{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px}
.steps b{flex:0 0 20px;height:20px;line-height:20px;border-radius:50%;background:#f4e6cf;color:#a4753a;font-size:12px;text-align:center}
.bar{height:6px;background:#efe6d7;border-radius:6px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b96b,#e08a3c);transition:width .25s}
.msg{font-size:12.5px;color:#9a8f7d;min-height:18px}
.note{margin-top:20px;font-size:11.5px;color:#b3a894;line-height:1.7}
.btn{display:none;margin:16px auto 0;padding:11px 22px;border:0;border-radius:22px;background:#e08a3c;color:#fff;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">✦</div>
  <h1>做你自己的个人主页</h1>
  <p class="sub">上传简历 + 一张照片，几分钟生成属于你的网站</p>
  <div class="steps">
    <div><b>1</b><span>粘贴简历文字，或上传 PDF</span></div>
    <div><b>2</b><span>上传一张照片，生成你的专属形象</span></div>
    <div><b>3</b><span>点「分享链接」，得到一个能发给任何人的网址</span></div>
  </div>
  <div class="bar"><i id="pbi"></i></div>
  <div class="msg" id="msg">正在准备模板…</div>
  <button class="btn" id="btn">重新加载</button>
  <p class="note">所有内容都在你自己的浏览器里处理，简历和照片不会上传到任何服务器。</p>
</div>
<script>
(function(){
  var V = '20260919a';
  var SRCS = [
    'https://cdn.jsdelivr.net/gh/Quentin040507/ai-avatar-kit@main/make-yours.html?v=' + V,
    'https://gcore.jsdelivr.net/gh/Quentin040507/ai-avatar-kit@main/make-yours.html?v=' + V,
    'https://quentin040507.github.io/ai-avatar-kit/make-yours.html?v=' + V,
    'app.html'
  ];
  var bi = document.getElementById('pbi'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
  function setMsg(t){ msg.textContent = t; }
  function setPct(got, len){
    var p = len ? Math.min(96, Math.round(got / len * 96)) : Math.min(90, Math.round(got / 6000));
    bi.style.width = p + '%';
    setMsg(len ? ('正在加载模板 ' + Math.round(got/1024) + ' / ' + Math.round(len/1024) + ' KB')
                : ('正在加载模板 ' + Math.round(got/1024) + ' KB'));
  }
  function grab(url, onp){
    return new Promise(function(res, rej){
      var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var to = setTimeout(function(){ if(ctl) ctl.abort(); rej(new Error('timeout')); }, 45000);
      var opt = { cache: 'no-store' };
      if(ctl) opt.signal = ctl.signal;
      fetch(url, opt).then(function(r){
        if(!r.ok) throw new Error('http ' + r.status);
        var len = +(r.headers.get('content-length') || 0);
        if(r.body && r.body.getReader){
          var rd = r.body.getReader(), dec = new TextDecoder('utf-8'), parts = [], got = 0;
          (function pump(){
            rd.read().then(function(d){
              if(d.done){ parts.push(dec.decode()); clearTimeout(to); res(parts.join('')); return; }
              parts.push(dec.decode(d.value, {stream:true})); got += d.value.length; onp(got, len); pump();
            }).catch(function(e){ clearTimeout(to); rej(e); });
          })();
        } else {
          r.text().then(function(t){ clearTimeout(to); res(t); }).catch(function(e){ clearTimeout(to); rej(e); });
        }
      }).catch(function(e){ clearTimeout(to); rej(e); });
    });
  }
  var tried = 0;
  function run(i){
    if(i >= SRCS.length){
      setMsg('加载失败，请检查网络后重试');
      btn.style.display = 'block';
      btn.onclick = function(){ location.reload(); };
      return;
    }
    tried = i;
    if(i > 0) setMsg('换一个通道重试（' + (i+1) + '/' + SRCS.length + '）…');
    var last = 0;
    grab(SRCS[i], function(got, len){
      if(got - last > 20000 || got === len){ last = got; setPct(got, len); }
    }).then(function(html){
      if(!html || html.length < 200000 || html.indexOf('lqGuide') < 0) throw new Error('bad');
      bi.style.width = '100%';
      setMsg('模板就绪，正在打开…');
      document.open();
      document.write(html);
      document.close();
    }).catch(function(){
      if(tried === i) run(i + 1);
    });
  }
  run(0);
})();
</script>
</body>
</html>
